[project]
name = "workplace-safety-vision"
version = "0.1.0"
description = "Computer Vision-Based Workplace Safety Monitoring System"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "ultralytics==8.3.161",
  "opencv-python==4.11.0.86",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
  "matplotlib==3.10.0",
  "seaborn==0.13.2",
  "tqdm==4.67.1",
  "pytest==8.3.4",
  "torch==2.7.1+cu126",
  "torchvision==0.22.1+cu126",
]
[tool.uv]
python-preference = "only-managed"
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu126"]
index-strategy = "unsafe-best-match"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
